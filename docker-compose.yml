services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: may-guitar-center:prod
    container_name: may-guitar-center-prod
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      WATCHPACK_POLLING: "false"
      CHOKIDAR_USEPOLLING: "false"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 768m
    mem_reservation: 256m
    cpus: 1.0
    tmpfs:
      - /tmp
    stop_grace_period: 30s
